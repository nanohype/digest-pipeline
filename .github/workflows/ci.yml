name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build + lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        # `npm install` instead of `npm ci`: the lockfile is generated on
        # macOS and omits Linux platform-specific optional deps that
        # vitest/rolldown pull in. `npm install` resolves them on the Linux
        # runner; version pinning comes from the lockfile regardless.
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Audit (production deps, high+ severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      # .editorconfig declares charset, LF endings, a final newline and no
      # trailing whitespace. Biome formats TS and JSON, so those rules held for
      # part of the tree and were unobserved everywhere else — YAML, HCL,
      # Markdown, shell. This checks them across every git-tracked file.
      #
      # Indentation checks stay off: Go answers to gofmt, Terraform to tofu fmt,
      # TS and JSON to biome, and Make requires tabs for recipes and spaces for
      # the continuation lines inside them. A second opinion there would either
      # be wrong or demand churn, so this gate takes the rules nothing else owns.
      #
      # The action reads the tree and fetches nothing while the check runs, so a
      # verdict this job reports is about this branch. It resolves during job
      # setup like every other pinned action, and a failure there stops the job
      # before this step exists rather than arriving as a finding about a file.
      # It self-tests before it reads, and names which of its two non-zero
      # verdicts it reached — "these files do not match" and "nothing was
      # checked" are different facts and only one of them is about the branch.
      - name: Editorconfig
        uses: nanohype/.github/actions/editorconfig-gate@b2eada74413fcc9f3042f22126ee5b350a2b846e # main

      # The metric-reference table in README is the authoritative name-and-label
      # list, and it is the kind of doc that goes stale silently: the alerts and
      # the dashboard query the real series, so a renamed instrument breaks
      # nothing and turns nothing red. It happened — the docs carried
      # `run.duration_ms` well after the rename to `run.duration_seconds`, and
      # claimed a `run_id` label on two metrics that deliberately carry none.
      # This compares the table to the instruments in both directions.
      - name: Documented metrics match the emitted ones
        run: npm run check:metrics

      - name: Test
        run: npm test -- --coverage

      - name: Build (emit dist)
        run: npm run build

      # platform.yaml is applied by hand before ArgoCD picks up the chart, so
      # nothing else reads it before a cluster does. Checked against the CRD
      # schemas vendored in schemas/crd/ — structure, cluster-vs-namespaced
      # scope, unknown fields, and the Tenant/Platform/BudgetPolicy references
      # between documents. Each schema is hashed against the SHA-256 recorded in
      # schemas/crd/source.json before it is parsed, so a vendored schema
      # edited in place fails here instead of quietly widening what the gate
      # accepts. The same command then runs the gate's --self-test: a gate
      # nobody exercises decays into a gate that passes everything, so it
      # mutates in-memory copies of platform.yaml, asserts each one is rejected,
      # and asserts the committed manifest is still accepted.
      - name: Validate platform.yaml against the CRD schemas, then self-test the gate
        run: npm run platform:validate

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Helm lint chart
        run: helm lint chart

      - name: Helm template (staging + production)
        run: |
          mkdir -p rendered
          helm template digest-pipeline chart -f chart/values-staging.yaml > rendered/staging.yaml
          helm template digest-pipeline chart -f chart/values-production.yaml > rendered/production.yaml

      # DATABASE_URL is composed by the External Secrets controller at runtime,
      # so what ships is a template — helm never sees the password and the Zod
      # schema that validates the result runs in the pod, long after CI. That
      # makes this the one value in the chart no gate here can otherwise reach.
      #
      # A credential interpolated raw is valid YAML and produces a broken URL as
      # soon as the password holds a character URLs reserve. Aurora draws from
      # "any printable ASCII except /, ", @, or space", leaving # ? : [ ] in
      # play; # is the worst, because a parser reads it as the fragment
      # delimiter and drops the rest of the string, @host included. The result
      # is still a well-formed URL, so Zod passes it, and the failure lands at
      # connect time naming the username as the host.
      #
      # Asserting the absence of the bare form as well as the presence of the
      # piped one means a newly added unescaped credential fails too, not only a
      # regression of these two.
      - name: Composed DATABASE_URL percent-encodes its credentials
        run: |
          fail=0
          for cred in pgUser pgPassword; do
            if grep -Eq "\{\{[[:space:]]*\.${cred}[[:space:]]*\}\}" rendered/staging.yaml rendered/production.yaml; then
              echo "::error::${cred} is interpolated into DATABASE_URL without urlquery — a password containing # or ? silently truncates the URL"
              fail=1
            fi
            grep -q "\.${cred} | urlquery" rendered/staging.yaml || {
              echo "::error::expected ${cred} to be piped through urlquery in the composed URL"
              fail=1
            }
          done
          exit $fail

      # Rendering proves the YAML parses, not that the pod it describes can boot.
      # Every entrypoint validates its environment with Zod, and a required key
      # with no default is a crash rather than a degraded mode — so the rendered
      # env set is compared against the schemas that read it, per environment.
      - name: DNS egress is scoped to kube-dns, not to all of kube-system
        run: |
          # A NetworkPolicy `to:` list is a list of PEERS, and peers are OR'd.
          # namespaceSelector and podSelector AND each other only inside ONE peer;
          # as two sibling list items they mean "every pod in kube-system" OR
          # "every same-namespace pod labelled k8s-app=kube-dns". Both forms render,
          # both are valid, both lint clean, and only one of them is DNS-only —
          # which is how the OR shipped here and in three sibling charts.
          python3 - <<'EOF'
          import glob, sys, yaml
          checked = 0
          for path in sorted(glob.glob("rendered/*.yaml")):
              for doc in yaml.safe_load_all(open(path)):
                  if not doc or doc.get("kind") != "NetworkPolicy":
                      continue
                  for rule in (doc["spec"].get("egress") or []):
                      ports = [str(p.get("port")) for p in (rule.get("ports") or [])]
                      if "53" not in ports:
                          continue
                      checked += 1
                      for peer in (rule.get("to") or []):
                          if "namespaceSelector" in peer and "podSelector" not in peer:
                              sys.exit(
                                  f"{path}: the DNS egress rule has a namespaceSelector "
                                  f"peer with no podSelector, so it allows egress to EVERY "
                                  f"pod in that namespace. Put both selectors in one peer."
                              )
          if not checked:
              sys.exit("no DNS egress rule found in rendered/ — this check verified nothing")
          print(f"ok  {checked} DNS egress rule(s) scope to kube-dns, not to a whole namespace")
          EOF
      - name: Rendered chart supplies every required env var
        run: npm run chart:check-env

      # Source files are gated elsewhere; this asserts the RENDERED chart too —
      # a zero account id, placeholder token, or account-less ARN that only
      # appears after templating.
      - name: Assert no unfilled sentinels in rendered output
        uses: nanohype/nanohype/.github/actions/render-assert@main
        with:
          manifests: rendered

  docs:
    name: docs
    runs-on: ubuntu-latest
    # Its own job because FOUR_PHASE_CONTRACT wants build, lint, test and docs
    # as four separately-failing phases. It was previously satisfied by an
    # `echo`, which exits 0 and regenerates nothing — a phase that cannot fail
    # is not a phase, and nothing here invoked it anyway.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Generate the API reference
        run: npm run docs

  vendored:
    name: vendored copy drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every vendored surface (src/vendor/runtime modules, biome.base.json,
      # the tenant-chart-base chart, and the sync script itself) must stay
      # byte-identical to its source of truth in
      # nanohype/nanohype, declared in scripts/vendored.json. Fixes propagate
      # outward from the library, never inward; a drifted copy is the defect.
      - name: Read the pinned nanohype ref
        id: pin
        run: |
          echo "repo=$(jq -r .upstream.repository scripts/vendored.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r .upstream.ref scripts/vendored.json)" >> "$GITHUB_OUTPUT"

      # Checked out at the pinned commit, not at main. Comparing against main
      # would make this required check a verdict about nanohype's latest merge
      # rather than about the commit under test — any library change upstream
      # would turn this repository red without a commit here. Whether the pin
      # has fallen behind is asked by the scheduled vendored-freshness
      # workflow, off the blocking path.
      # Not a sparse checkout: the gate reads upstream through git objects at
      # the pinned commit rather than from the working tree, and a sparse
      # checkout is a partial clone whose blobs outside the cone are fetched
      # lazily. A full checkout of one small repository is the cheaper
      # guarantee.
      - name: Check out the vendored source of truth at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: .nanohype

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check vendored copies against the source of truth
        run: node scripts/sync-vendored.mjs --check
        env:
          NANOHYPE_DIR: .nanohype

      # The gate's own guards, exercised rather than assumed. It vendors into a
      # scratch root from the same pinned checkout the step above reads, then
      # breaks the inputs every rule exists to catch — a branch name where a SHA
      # is required, a pin no checkout contains, an edited copy, an unexpected
      # or deleted file in a vendored tree, an undeclared module in an exclusive
      # directory — and fails unless each one is rejected.
      - name: Vendored copy gate self-test
        run: node scripts/sync-vendored.mjs --self-test
        env:
          NANOHYPE_DIR: .nanohype

  crd-schema-drift:
    name: CRD schema drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CRD schemas in schemas/crd/ are generated by controller-gen in
      # nanohype/eks-agent-platform. They're committed here so the platform.yaml
      # gate always has a schema — a validator that fetches its schema at run
      # time reports success when the fetch fails, which is the one outcome a
      # gate must never produce.
      #
      # Committing them opens the other hole: the copies can be edited, or the
      # pin can be bumped without re-vendoring, and nothing offline would know.
      # So this job resolves the commit recorded in schemas/crd/source.json,
      # checks the operator repo out at exactly that commit, and byte-compares.
      # A hand-edited copy and a pin that no longer describes what is vendored
      # both fail here and land as a visible re-sync commit. There is no skip
      # path: an unreachable upstream fails the job.
      #
      # Whether that pin has fallen behind upstream is a different question, and
      # not one a required check may answer — its verdict would change when
      # someone pushes to another repository. The scheduled
      # crd-schema-freshness workflow asks it instead.
      - name: Read the pinned operator ref
        id: pin
        run: |
          echo "repo=$(jq -r .upstream.repository schemas/crd/source.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r .upstream.ref schemas/crd/source.json)" >> "$GITHUB_OUTPUT"

      - name: Check out the CRD source of truth at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: .eks-agent-platform
          sparse-checkout: |
            operators/config/crd/bases

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vendored CRD schemas match the pinned upstream commit
        run: npm run schemas:check
        env:
          EKS_AGENT_PLATFORM_DIR: .eks-agent-platform

      # The scheduled freshness report runs weekly; what it SAYS is asserted
      # here, on every pull request. Its remediation is copied into an issue body
      # that is read on whatever day someone opens it, so an instruction naming a
      # commit one run resolved is presented as current until the next run —
      # and following it re-vendors to the wrong ref while closing an issue that
      # should stay open. This builds its own upstream repository whose commits it
      # knows, runs the report against it, and asserts on the bytes that come
      # back: no commit id anywhere, a remediation naming `--ref=latest`, and then
      # that command run for real against the same repository, required to land
      # the pin on the newest commit touching the vendored path. Needs no network
      # and no upstream checkout — it builds both.
      - name: Freshness report names a command, not a commit
        run: npm run schemas:selftest

  web:
    name: web build + typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        # Same reason as the app install: the lockfile lacks the
        # Linux platform-conditional binaries (rolldown, lightningcss,
        # esbuild) that Next.js 16 pulls in on Linux runners.
        run: npm install --prefer-offline --no-audit --no-fund

      # No ESLint step: eslint-config-next's flat config is incompatible with
      # ESLint 10 (FlatCompat circular-structure crash), and the React/Next
      # eslint stack doesn't yet support ESLint 10. The web app is gated by
      # strict tsc --noEmit + a production next build. Re-add eslint here once
      # eslint-config-next ships ESLint 10 flat-config support.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build (Next.js standalone)
        run: npm run build
        env:
          WORKOS_API_KEY: ci-placeholder
          WORKOS_CLIENT_ID: ci-placeholder
          WORKOS_COOKIE_PASSWORD: ci-placeholder-32-char-string-pad!
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: https://digest-pipeline.internal/callback
          API_BASE_URL: https://api.digest-pipeline.internal
          OTEL_SDK_DISABLED: 'true'
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
          OTEL_SERVICE_NAME: digest-pipeline-web

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    services:
      # Backs the migration-hook check below. The hook is the first thing every
      # install and upgrade runs, so it is worth a real database rather than a
      # smoke test against a stub.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: digest_pipeline_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t digest-pipeline-api:ci .
      - run: docker build -f Dockerfile.pipeline -t digest-pipeline-pipeline:ci .
      - run: docker build -f Dockerfile.web -t digest-pipeline-web:ci .

      # The chart's pre-install/pre-upgrade hook runs `migrate:up` inside this
      # image. Building the image proves the code compiles; only running the
      # hook's own command proves the image contains what the hook needs at the
      # moment it runs. Those are different questions, and the gap between them
      # is where this broke: the migrator was invoked through tsx — a
      # devDependency stripped by `npm prune --omit=dev` — from a directory the
      # runtime stage never copied. Every ArgoCD PreSync failed while every gate
      # here stayed green.
      - name: the migration hook runs inside the api image
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e DATABASE_URL='postgres://postgres:ci@127.0.0.1:5432/digest_pipeline_ci' \
            digest-pipeline-api:ci npm run migrate:up

      # Exiting 0 is not the same as having done something. A migrator that
      # found an empty directory would also succeed, so assert the run was
      # recorded and the schema it creates is really present.
      - name: the migration actually landed
        run: |
          set -euo pipefail
          psql() {
            docker run --rm --network host -e PGPASSWORD=ci postgres:17-alpine \
              psql -h 127.0.0.1 -U postgres -d digest_pipeline_ci -tAc "$1"
          }
          applied=$(psql "SELECT count(*) FROM schema_migrations")
          [ "$applied" -ge 1 ] || { echo "::error::migrate:up recorded no migrations"; exit 1; }
          for table in drafts audit_events email_analytics; do
            present=$(psql "SELECT to_regclass('public.$table') IS NOT NULL")
            [ "$present" = "t" ] || { echo "::error::table $table missing after migrate:up"; exit 1; }
          done
          echo "$applied migration(s) applied; drafts, audit_events, email_analytics all present"

  data-layer:
    name: data layer (real Postgres)
    runs-on: ubuntu-latest
    # The draft status machine is written in SQL — conditional UPDATEs plus CHECK
    # constraints — so the guards it depends on are enforced by the engine rather
    # than by TypeScript. The unit suite asserts the statements this repo sends,
    # which a fake pool can do; it cannot assert that Postgres agrees, and the
    # property the approval gate rests on (two approvals racing, exactly one
    # wins) has no meaning without a real transaction.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: digest_pipeline_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm install --prefer-offline --no-audit --no-fund
      # TEST_DATABASE_URL set means the tier MUST run: the suite skips only when
      # the variable is absent, and a database that is present but unreachable is
      # a hard failure. That is deliberate — a suite that quietly skips turns an
      # absence of evidence into a claim of safety, which is the same contract
      # the eval tier holds EVAL_LLM to.
      - name: Data-layer tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/digest_pipeline_ci
        run: npm run test:db

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    needs:
      [
        verify,
        docs,
        vendored,
        crd-schema-drift,
        web,
        docker,
        data-layer,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
