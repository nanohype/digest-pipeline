# Staging delta.
image:
  tag: staging

ingress:
  host: digest-pipeline-staging.example.com

externalSecret:
  approversSecret: digest-pipeline/staging/approvers
  workosSecret: digest-pipeline/staging/workos-directory
  dbCredentialsSecret: digest-pipeline/staging/db-credentials
  grafanaCloudSecret: digest-pipeline/staging/grafana-cloud

env:
  OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=digest-pipeline,service.version=0.1.0,deployment.environment=staging,agents.tenant=growth,agents.platform=digest-pipeline'

tenantInfra:
  # Bucket names match landing-zone digest-pipeline-platform outputs 1:1
  # (voice_baseline_bucket_name, raw_aggregations_bucket_name). The Slack
  # channel ID + secret IDs are digest-pipeline-specific config, not infra outputs.
  voiceBaselineBucket: digest-pipeline-staging-voice-baseline
  rawAggregationsBucket: digest-pipeline-staging-raw-aggregations
  slackReviewChannelId: '' # per-env Slack channel; fill once known
  approversSecretId: digest-pipeline/staging/approvers
  workosDirectorySecretId: digest-pipeline/staging/workos-directory
