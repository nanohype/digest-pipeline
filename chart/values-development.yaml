# Development delta.
image:
  tag: development

ingress:
  host: digest-pipeline-development.example.com

externalSecret:
  approversSecret: digest-pipeline/development/approvers
  workosSecret: digest-pipeline/development/workos-directory
  dbCredentialsSecret: digest-pipeline/development/db-credentials
  runtimeConfigSecret: digest-pipeline/development/runtime-config
  webConfigSecret: digest-pipeline/development/web-config

env:
  OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=digest-pipeline,service.version=0.1.0,deployment.environment=development,agents.tenant=growth,agents.platform=digest-pipeline'

tenantInfra:
  # Bucket names match landing-zone tenant-substrate outputs 1:1
  # (voice_baseline_bucket_name, raw_aggregations_bucket_name). The Slack
  # channel ID + secret IDs are digest-pipeline-specific config, not infra outputs.
  voiceBaselineBucket: digest-pipeline-development-voice-baseline
  rawAggregationsBucket: digest-pipeline-development-raw-aggregations
  approversSecretId: digest-pipeline/development/approvers
  workosDirectorySecretId: digest-pipeline/development/workos-directory
  slackSecretId: digest-pipeline/development/slack
  githubSecretId: digest-pipeline/development/github
  linearSecretId: digest-pipeline/development/linear
  notionSecretId: digest-pipeline/development/notion
