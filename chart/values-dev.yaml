# Dev delta.
image:
  tag: dev

ingress:
  host: digest-pipeline-dev.example.com

externalSecret:
  approversSecret: digest-pipeline/dev/approvers
  workosSecret: digest-pipeline/dev/workos-directory
  dbCredentialsSecret: digest-pipeline/dev/db-credentials
  grafanaCloudSecret: digest-pipeline/dev/grafana-cloud

env:
  OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=digest-pipeline,service.version=0.1.0,deployment.environment=dev,agents.tenant=protohype,agents.platform=digest-pipeline'

tenantInfra:
  # Bucket names match landing-zone digest-pipeline-platform outputs 1:1
  # (voice_baseline_bucket_name, raw_aggregations_bucket_name). The Slack
  # channel ID + secret IDs are digest-pipeline-specific config, not infra outputs.
  voiceBaselineBucket: digest-pipeline-voice-baseline-dev
  rawAggregationsBucket: digest-pipeline-raw-aggregations-dev
  slackReviewChannelId: '' # per-env Slack channel; fill once known
  approversSecretId: digest-pipeline/dev/approvers
  workosDirectorySecretId: digest-pipeline/dev/workos-directory
