# Production delta.
image:
  tag: production

api:
  replicaCount: 2

web:
  replicaCount: 2

ingress:
  host: digest-pipeline.example.com

externalSecret:
  approversSecret: digest-pipeline/production/approvers
  workosSecret: digest-pipeline/production/workos-directory
  dbCredentialsSecret: digest-pipeline/production/db-credentials
  grafanaCloudSecret: digest-pipeline/production/grafana-cloud

env:
  OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=digest-pipeline,service.version=0.1.0,deployment.environment=production,agents.tenant=protohype,agents.platform=digest-pipeline'

tenantInfra:
  # Bucket names match landing-zone digest-pipeline-platform outputs 1:1.
  voiceBaselineBucket: digest-pipeline-production-voice-baseline
  rawAggregationsBucket: digest-pipeline-production-raw-aggregations
  slackReviewChannelId: ''
  approversSecretId: digest-pipeline/production/approvers
  workosDirectorySecretId: digest-pipeline/production/workos-directory
