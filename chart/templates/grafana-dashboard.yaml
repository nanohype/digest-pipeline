{{- if .Values.grafanaDashboard.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dispatch.fullname" . }}-dashboard
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  dispatch.json: |-
    {{- .Files.Get "dashboards/dispatch.json" | nindent 4 }}
{{- end }}
