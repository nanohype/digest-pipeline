{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenant-chart-base.fullname" . }}-web
  labels:
    {{- include "tenant-chart-base.labels" . | nindent 4 }}
    digest-pipeline.io/service: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "digest-pipeline.selectorLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "service" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenant-chart-base.labels" . | nindent 8 }}
        digest-pipeline.io/service: web
      annotations:
        checksum/external-secret: {{ printf "%s-%s" .Values.externalSecret.workosSecret .Values.externalSecret.refreshInterval | sha256sum }}
    spec:
      serviceAccountName: {{ include "tenant-chart-base.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}-{{ .Values.web.imageTagSuffix }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            {{- include "digest-pipeline.env" (dict "Values" .Values "service" "web") | nindent 12 }}
            - name: OTEL_SERVICE_NAME
              value: digest-pipeline-web
            - name: PORT
              value: {{ .Values.web.port | quote }}
            # The upstream the Next.js route handlers proxy to — the name
            # `web/lib/api.ts` reads, and the one `docs/local-development.md`
            # sets outside the cluster. Same chart release, so resolve via the
            # api Service DNS name; the api is not on the Ingress and this is
            # the only route to it.
            - name: API_BASE_URL
              value: "http://{{ include "tenant-chart-base.fullname" . }}-api:{{ .Values.api.port }}"
          envFrom:
            - secretRef:
                name: {{ include "tenant-chart-base.fullname" . }}-secrets
          livenessProbe:
            {{- toYaml .Values.probes.web.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.web.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}
{{- end }}
