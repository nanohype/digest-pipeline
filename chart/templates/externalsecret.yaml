{{- if .Values.externalSecret.enabled -}}
# Aggregates secrets from four AWS Secrets Manager entries into one k8s Secret
# that all three workloads (pipeline + api + web) consume via envFrom:
#   - dispatch/<env>/db-credentials        → DATABASE_URL components
#   - dispatch/<env>/approvers             → APPROVERS_CONFIG (cosUserId + backupApproverIds[])
#   - dispatch/<env>/workos-directory      → WORKOS_API_KEY + WORKOS_DIRECTORY_ID
#   - dispatch/<env>/grafana-cloud         → OTLP basic-auth header (passed via env to the SDK)

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "dispatch.fullname" . }}-secrets
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "dispatch.fullname" . }}-secrets
    creationPolicy: Owner
    # Compose DATABASE_URL from db-credentials components. The Aurora component
    # in landing-zone publishes username + password + host + port + dbname; the
    # app's Zod schema validates the final URL string.
    template:
      data:
        DATABASE_URL: "postgresql://{{ "{{" }} .pgUser {{ "}}" }}:{{ "{{" }} .pgPassword {{ "}}" }}@{{ "{{" }} .pgHost {{ "}}" }}:{{ "{{" }} .pgPort {{ "}}" }}/{{ "{{" }} .pgDatabase {{ "}}" }}"
        APPROVERS_CONFIG: "{{ "{{" }} .approvers {{ "}}" }}"
        WORKOS_API_KEY: "{{ "{{" }} .workosApiKey {{ "}}" }}"
        WORKOS_DIRECTORY_ID: "{{ "{{" }} .workosDirectoryId {{ "}}" }}"
        OTEL_EXPORTER_OTLP_HEADERS: "{{ "{{" }} .grafanaAuthHeader {{ "}}" }}"
  data:
    - secretKey: pgUser
      remoteRef:
        key: {{ .Values.externalSecret.dbCredentialsSecret }}
        property: username
    - secretKey: pgPassword
      remoteRef:
        key: {{ .Values.externalSecret.dbCredentialsSecret }}
        property: password
    - secretKey: pgHost
      remoteRef:
        key: {{ .Values.externalSecret.dbCredentialsSecret }}
        property: host
    - secretKey: pgPort
      remoteRef:
        key: {{ .Values.externalSecret.dbCredentialsSecret }}
        property: port
    - secretKey: pgDatabase
      remoteRef:
        key: {{ .Values.externalSecret.dbCredentialsSecret }}
        property: dbname
    - secretKey: approvers
      remoteRef:
        key: {{ .Values.externalSecret.approversSecret }}
        property: config
    - secretKey: workosApiKey
      remoteRef:
        key: {{ .Values.externalSecret.workosSecret }}
        property: apiKey
    - secretKey: workosDirectoryId
      remoteRef:
        key: {{ .Values.externalSecret.workosSecret }}
        property: directoryId
    - secretKey: grafanaAuthHeader
      remoteRef:
        key: {{ .Values.externalSecret.grafanaCloudSecret }}
        property: authHeader
{{- end }}
