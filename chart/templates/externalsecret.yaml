{{- if .Values.externalSecret.enabled -}}
# Aggregates secrets from three AWS Secrets Manager entries into one k8s Secret
# that all three workloads (pipeline + api + web) consume via envFrom:
#   - digest-pipeline/<env>/db-credentials        → DATABASE_URL components
#   - digest-pipeline/<env>/approvers             → APPROVERS_CONFIG (cosUserId + backupApproverIds[])
#   - digest-pipeline/<env>/workos-directory      → WORKOS_API_KEY + WORKOS_DIRECTORY_ID
#   - digest-pipeline/<env>/runtime-config        → SLACK_REVIEW_CHANNEL_ID, SES_FROM_ADDRESS,
#                                                   NEWSLETTER_RECIPIENT_LIST
#   - digest-pipeline/<env>/web-config            → WORKOS_CLIENT_ID + WORKOS_COOKIE_PASSWORD
#
# The last two are not secret material — they are deployment-specific values the
# chart cannot know: which Slack channel review lands in, which verified SES
# identity sends, who receives, which WorkOS client. They ride here because
# seed-secrets.sh already creates both entries per environment and because every
# one of them is a `z.string().min(1)` with no default, so a pod without them
# fails validation at startup rather than degrading.
#
# No OTLP credential here. The pods export to the in-cluster OpenTelemetry Collector,
# which takes no authentication on its OTLP receiver; the gateway owns the upstream
# auth (SigV4 to Amazon Managed Prometheus via its own Pod Identity) and Tempo
# and Loki are in-cluster. Nothing downstream would read an Authorization
# header from these pods.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "tenant-chart-base.fullname" . }}-secrets
  labels:
    {{- include "tenant-chart-base.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "tenant-chart-base.fullname" . }}-secrets
    creationPolicy: Owner
    # Compose DATABASE_URL from db-credentials components. The Aurora component
    # in landing-zone publishes username + password + host + port + dbname; the
    # app's Zod schema validates the final URL string.
    template:
      data:
        DATABASE_URL: "postgresql://{{ "{{" }} .pgUser {{ "}}" }}:{{ "{{" }} .pgPassword {{ "}}" }}@{{ "{{" }} .pgHost {{ "}}" }}:{{ "{{" }} .pgPort {{ "}}" }}/{{ "{{" }} .pgDatabase {{ "}}" }}"
        APPROVERS_CONFIG: "{{ "{{" }} .approvers {{ "}}" }}"
        WORKOS_API_KEY: "{{ "{{" }} .workosApiKey {{ "}}" }}"
        WORKOS_DIRECTORY_ID: "{{ "{{" }} .workosDirectoryId {{ "}}" }}"
        SLACK_REVIEW_CHANNEL_ID: "{{ "{{" }} .slackReviewChannelId {{ "}}" }}"
        SES_FROM_ADDRESS: "{{ "{{" }} .sesFromAddress {{ "}}" }}"
        NEWSLETTER_RECIPIENT_LIST: "{{ "{{" }} .newsletterRecipientList {{ "}}" }}"
        WORKOS_CLIENT_ID: "{{ "{{" }} .workosClientId {{ "}}" }}"
        # AuthKit's middleware throws when this is absent or under 32 characters,
        # and the middleware matcher excludes api/health — so without this the
        # readiness probe stays green while every page in the review UI 500s.
        # seed-secrets.sh auto-generates a 48-char value when the seed file
        # leaves it empty, so the length constraint is satisfied at seed time.
        WORKOS_COOKIE_PASSWORD: "{{ "{{" }} .cookiePassword {{ "}}" }}"
  data:
    - secretKey: pgUser
      remoteRef:
        key: {{ .Values.externalSecret.dbCredentialsSecret }}
        property: username
    - secretKey: pgPassword
      remoteRef:
        key: {{ .Values.externalSecret.dbCredentialsSecret }}
        property: password
    - secretKey: pgHost
      remoteRef:
        key: {{ .Values.externalSecret.dbCredentialsSecret }}
        property: host
    - secretKey: pgPort
      remoteRef:
        key: {{ .Values.externalSecret.dbCredentialsSecret }}
        property: port
    - secretKey: pgDatabase
      remoteRef:
        key: {{ .Values.externalSecret.dbCredentialsSecret }}
        property: dbname
    - secretKey: approvers
      remoteRef:
        # No `property`: seed-secrets.sh writes the whole {cosUserId,
        # backupApproverIds} object as the secret string, and APPROVERS_CONFIG is
        # that JSON. Naming a property here asks for a key the secret does not
        # have, which fails the sync rather than the render.
        key: {{ .Values.externalSecret.approversSecret }}
    - secretKey: workosApiKey
      remoteRef:
        key: {{ .Values.externalSecret.workosSecret }}
        property: apiKey
    - secretKey: workosDirectoryId
      remoteRef:
        key: {{ .Values.externalSecret.workosSecret }}
        property: directoryId
    - secretKey: slackReviewChannelId
      remoteRef:
        key: {{ .Values.externalSecret.runtimeConfigSecret }}
        property: slackReviewChannelId
    - secretKey: sesFromAddress
      remoteRef:
        key: {{ .Values.externalSecret.runtimeConfigSecret }}
        property: sesFromAddress
    - secretKey: newsletterRecipientList
      remoteRef:
        key: {{ .Values.externalSecret.runtimeConfigSecret }}
        property: newsletterRecipients
    - secretKey: workosClientId
      remoteRef:
        key: {{ .Values.externalSecret.webConfigSecret }}
        property: workosClientId
    - secretKey: cookiePassword
      remoteRef:
        key: {{ .Values.externalSecret.webConfigSecret }}
        property: cookiePassword
{{- end }}
