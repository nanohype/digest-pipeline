{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dispatch.serviceAccountName" . }}
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
  # All three workloads (pipeline CronJob + api + web Deployments) share one
  # ServiceAccount. The IRSA role is provisioned by landing-zone's
  # dispatch-platform component — its trust policy permits assumption by
  # this SA in this namespace, and its inline policy bundles every action
  # the pods need (Aurora RDS connect, S3 PutObject + GetObject on the
  # voice-baseline + raw-aggregations buckets, SES SendEmail on the
  # verified identity, Bedrock invoke, Secrets Manager read, CloudWatch
  # PutMetricData). The role ARN is the component's `irsa_role_arn`
  # output; per-env values plumb it into `aws.platformRoleArn`, and the
  # annotation below picks it up.
  {{- if or .Values.aws.platformRoleArn .Values.serviceAccount.annotations }}
  annotations:
    {{- if .Values.aws.platformRoleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.aws.platformRoleArn | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
