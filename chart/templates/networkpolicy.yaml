{{- if .Values.networkPolicy.enabled }}
# Ingress: ingress-nginx → api + web only. Pipeline CronJob pods have no
# inbound; the empty ingress block on their NetworkPolicy is implicit
# (only the api/web pods carry the digest-pipeline.io/service in {api,web} selector
# label that matches the rule).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tenant-chart-base.fullname" . }}
  labels:
    {{- include "tenant-chart-base.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "tenant-chart-base.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
        - protocol: TCP
          port: {{ .Values.web.port }}
    # Intra-pod (web → api on the cluster network)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: {{ include "tenant-chart-base.name" . }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
