{{- if .Values.networkPolicy.enabled }}
# Ingress: the load balancer → web only, plus intra-pod web → api. The api
# Deployment takes no inbound from outside the release: it is not on the
# Ingress, and web is the only client it has. Pipeline CronJob pods have no
# inbound at all — neither rule's port matches them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tenant-chart-base.fullname" . }}
  labels:
    {{- include "tenant-chart-base.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "tenant-chart-base.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The ALB is not a pod, so this cannot be a namespaceSelector: with
    # target-type ip the connection arrives from an ALB network interface in the
    # cluster VPC, and the source is a VPC address. 10.0.0.0/8 is the range the
    # landing-zone network component allocates VPC CIDRs from; narrow it to the
    # public subnet CIDRs per-env where the blast radius matters.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: {{ .Values.web.port }}
    # Intra-pod (web → api on the cluster network)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: {{ include "tenant-chart-base.name" . }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
