{{- if .Values.migrate.enabled }}
# Helm pre-install / pre-upgrade hook: applies pending DB migrations BEFORE
# the new chart version's pipeline/api/web pods roll out. Without this hook, a
# chart upgrade could cut over to code that references a schema column the
# migrations haven't created yet.
#
# `migrate:up` runs the compiled `dist/data/migrate.js`, and Dockerfile.api
# COPYs `migrations/` into the runtime stage. Both matter: the image is built
# with `npm prune --omit=dev`, so anything reached through tsx — or living
# outside the compiled output — is absent here, and the .sql files are data the
# TypeScript build would not carry on its own.

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tenant-chart-base.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "tenant-chart-base.labels" . | nindent 4 }}
    digest-pipeline.io/service: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "tenant-chart-base.labels" . | nindent 8 }}
        digest-pipeline.io/service: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "tenant-chart-base.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}-{{ .Values.api.imageTagSuffix }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["npm", "run", "migrate:up"]
          env:
            {{- include "digest-pipeline.env" (dict "Values" .Values "service" "migrate") | nindent 12 }}
            - name: OTEL_SDK_DISABLED
              value: "true"
          envFrom:
            - secretRef:
                name: {{ include "tenant-chart-base.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
