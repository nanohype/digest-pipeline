{{- if .Values.prometheusRule.enabled -}}
# PromQL rules over OTel metrics exported by src/common/metrics.ts:
#   digest-pipeline.run.duration_ms{status}
#   digest-pipeline.source.{items,failure}{source}
#   digest-pipeline.bedrock.{tokens{kind,model},fallback}
#   digest-pipeline.draft.edit_rate{run_id}
#   digest-pipeline.email.sent{run_id}
#
# Metric names land in Mimir after the OTel collector's metric-name
# normalization (dots → underscores). Adjust label selectors below if
# your collector pipeline uses different relabel rules.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "tenant-chart-base.fullname" . }}
  labels:
    {{- include "tenant-chart-base.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.selector }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: digest-pipeline.pipeline
      interval: 1m
      rules:
        - alert: DigestPipelineRunFailureRateHigh
          # Pipeline runs land in three terminal statuses: ok / partial /
          # failed. Anything non-ok ratio rising above 50% across the last
          # 4 weekly runs (28 days) is suspicious — sources are degraded
          # or the generator is regressing.
          expr: |
            (sum(increase(digest_pipeline_run_duration_ms_count{status!="SUCCESS"}[28d]))
             / sum(increase(digest_pipeline_run_duration_ms_count[28d]))) > 0.5
          for: 1h
          labels:
            severity: page
            service: digest-pipeline
          annotations:
            summary: DigestPipeline pipeline non-ok rate > 50% over the last 4 runs
            description: |
              {{ "{{" }} $value | humanizePercentage {{ "}}" }} of the last 4 weekly runs ended in PARTIAL or FAILED status.
              Either a source is broken or the generator is regressing — check the latest run's logs.
              Runbook: docs/troubleshooting.md § "Pipeline run failures"

        - alert: DigestPipelineRunDurationP95Breach
          expr: histogram_quantile(0.95, sum by (le) (rate(digest_pipeline_run_duration_ms_bucket[28d]))) > 600000
          for: 1h
          labels:
            severity: warn
            service: digest-pipeline
            slo: run-under-10min
          annotations:
            summary: DigestPipeline pipeline P95 run duration > 10 minutes
            description: |
              P95 run duration over the last 28 days is {{ "{{" }} $value | printf "%.0f" {{ "}}" }} ms (>600000 ms = 10 min).
              Bedrock or an aggregator is degrading — review the slowest stage in the trace.
              Runbook: docs/troubleshooting.md § "Run duration SLO"

    - name: digest-pipeline.sources
      interval: 5m
      rules:
        - alert: DigestPipelineSourceFailing
          # A single source failing two consecutive weekly runs is a real
          # incident — the next run will have a stale or empty section.
          expr: |
            (sum by (source) (increase(digest_pipeline_source_failure_total[14d]))
             / sum by (source) (increase(digest_pipeline_source_items_total[14d]) + increase(digest_pipeline_source_failure_total[14d]))) > 0.5
          for: 1h
          labels:
            severity: warn
            service: digest-pipeline
          annotations:
            summary: DigestPipeline source {{ "{{" }} $labels.source {{ "}}" }} failure rate > 50% over two runs
            description: |
              {{ "{{" }} $labels.source {{ "}}" }} failure rate over the last 14 days is {{ "{{" }} $value | humanizePercentage {{ "}}" }}.
              Likely causes: third-party API token expired, schema changed, rate-limit ban.
              Runbook: docs/troubleshooting.md § "Source failures"

    - name: digest-pipeline.bedrock-ai
      interval: 5m
      rules:
        - alert: DigestPipelineBedrockFallbackHigh
          # The generator falls back to a safe template if Bedrock fails
          # or returns unparseable output. Any fallback in a production
          # run is shipping a less-good newsletter to readers.
          expr: sum(increase(digest_pipeline_bedrock_fallback_total[28d])) > 0
          for: 1h
          labels:
            severity: page
            service: digest-pipeline
          annotations:
            summary: DigestPipeline hit Bedrock fallback in the last 4 weekly runs
            description: |
              {{ "{{" }} $value | printf "%.0f" {{ "}}" }} fallback(s) used across the last 4 runs.
              Output quality is degraded — verify model availability + prompt validity.
              Runbook: docs/troubleshooting.md § "Bedrock fallback"

{{- end }}
