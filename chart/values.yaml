# Base values for digest-pipeline (all environments). Per-env deltas in values-{staging,production}.yaml.
#
# Three services in one chart:
#   - pipeline (CronJob, weekly Friday 09:00 UTC) — aggregates → ranks → generates → audits → notifies
#   - api      (Deployment) — Fastify API for the review UI; JWT-gated, port 3001
#   - web      (Deployment) — Next.js review app; WorkOS AuthKit, port 3000
# The Ingress routes everything to web, which is the only public tier. api is
# ClusterIP-only, reached server-side by web's route handlers. Pipeline is
# internal-only (no Service).

image:
  repository: ghcr.io/nanohype/digest-pipeline
  # Per-service tag suffix appended to base tag (e.g., :production-pipeline,
  # :production-api, :production-web). Tag set per-env in values-{env}.yaml.
  tag: ''
  pullPolicy: IfNotPresent

serviceAccount:
  # The operator creates and owns the `tenant-runtime` ServiceAccount and binds
  # it to the `<env>-digest-pipeline-tenant` role via an EKS Pod Identity
  # association, so the pod runs as it with no role-arn annotation and the chart
  # carries no AWS account values. The chart references that SA rather than
  # minting its own.
  create: false
  name: tenant-runtime
  # Free-form additional annotations to merge into the ServiceAccount.
  annotations: {}

# Resource attributes the shared chart labels read (tenant-chart-base.labels →
# agents.nanohype.dev/{tenant,platform}). The OTEL_RESOURCE_ATTRIBUTES env var
# carries the same values into the app's OTel SDK at runtime.
otel:
  resourceAttributes:
    agents.tenant: growth
    agents.platform: digest-pipeline

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ─── Per-service config ─────────────────────────────────────────────

pipeline:
  enabled: true
  # Weekly Friday 09:00 UTC (DST-aware behavior the EventBridge two-rule
  # pattern provided is approximated by always running in UTC — matches the
  # in-app PST/PDT split since cluster wall-clock is now the source).
  schedule: '0 9 * * 5'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  activeDeadlineSeconds: 1800 # 30-min hard timeout per run
  imageTagSuffix: pipeline
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

api:
  enabled: true
  imageTagSuffix: api
  replicaCount: 1
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  enabled: true
  imageTagSuffix: web
  replicaCount: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

probes:
  api:
    liveness:
      httpGet:
        path: /health
        port: 3001
      initialDelaySeconds: 15
      periodSeconds: 30
    readiness:
      httpGet:
        path: /health
        port: 3001
      initialDelaySeconds: 5
      periodSeconds: 10
  web:
    liveness:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 15
      periodSeconds: 30
    readiness:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 10

# The single public entry point. Everything under `host` goes to the web
# Deployment: pages, and the Next.js route handlers under /api/* that hold the
# WorkOS AuthKit session and proxy to the Fastify api server-side. The api
# Deployment is deliberately not routed here — its every route but /health
# requires a bearer token the browser never holds, and only web can mint one
# from the session cookie.
#
# The eks-gitops catalog's ingress implementation is the AWS Load Balancer
# Controller (addons/networking/aws-load-balancer-controller). It creates an
# `alb` IngressClass and does not mark it the cluster default, so the class is
# named explicitly. external-dns runs with `sources: [service, ingress]` and
# publishes a Route53 record for `host` off this object. On a cluster
# participating in a VPC it does not own, the Kyverno `inject-adopt-lb-subnets`
# policy fills in the subnet annotation from the scheme set below.
ingress:
  enabled: true
  className: alb
  # internal | internet-facing. The controller defaults to internal when unset;
  # the review UI is reached from outside the VPC, so say so.
  scheme: internet-facing
  # Cilium runs ENI IPAM with native routing, so pod IPs are VPC IPs and the ALB
  # registers pods directly. Instance targets would need a NodePort Service.
  targetType: ip
  tls:
    enabled: true
    # ACM certificate for `host`. Left empty, the controller discovers a
    # certificate in ACM whose domain matches the host on the rule below. TLS
    # terminates at the ALB — there is no in-cluster certificate and no Secret.
    certificateArn: ''
  # ALB target-group health check. Next.js answers this at
  # web/app/api/health/route.ts, and the AuthKit middleware matcher excludes it,
  # so the probe is not redirected to a sign-in page.
  healthcheckPath: /api/health
  # Set the same value on several Ingresses to put them behind one shared ALB.
  # Empty gives this Ingress a load balancer of its own.
  groupName: ''
  host: '' # set per-env
  paths:
    web: /

externalSecret:
  enabled: true
  secretStore: aws-secrets-manager
  refreshInterval: 1h
  # Source secrets in AWS Secrets Manager (composed per-env by the seed scripts).
  approversSecret: '' # digest-pipeline/<env>/approvers
  workosSecret: '' # digest-pipeline/<env>/workos-directory
  dbCredentialsSecret: '' # digest-pipeline/<env>/db-credentials
  # Deployment-specific values that are not infrastructure outputs and are not
  # knowable at chart-authoring time — the Slack channel the review lands in, the
  # verified SES sender, the recipient list, the WorkOS client. seed-secrets.sh
  # already creates both entries; the chart projects them here so a rendered pod
  # carries them as env.
  runtimeConfigSecret: '' # digest-pipeline/<env>/runtime-config
  webConfigSecret: '' # digest-pipeline/<env>/web-config

# Helm hook: applies pending DB migrations BEFORE the new chart version rolls
# out, against the same Postgres the api/pipeline reach via DATABASE_URL.
migrate:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheusRule:
  # Ships SLO recording rules + burn-rate alerts to a Prometheus Operator
  # (kube-prometheus-stack). Off by default — inert without an operator, which
  # the managed-Prometheus stack (the OpenTelemetry Collector + AMP, alerts in Amazon Managed
  # Grafana) doesn't run. Set `enabled: true` on a cluster that runs one.
  enabled: false
  selector:
    release: kube-prometheus-stack

grafanaDashboard:
  # GrafanaDashboard CR reconciled by the grafana-operator onto the external
  # Amazon Managed Grafana (works on both EKS and the local kx cluster).
  enabled: true
  instanceSelector:
    dashboards: external
  allowCrossNamespaceImport: true
  resyncPeriod: 24h

networkPolicy:
  enabled: true
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # HTTPS — Bedrock, S3, Secrets Manager, SES, WorkOS, GitHub, Linear,
    # Notion, Slack (all external aggregator sources + AWS APIs)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 443
    # Postgres (Aurora via landing-zone rag/pipeline component)
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
    # OTLP traces + metrics + logs to the OpenTelemetry Collector gateway
    # (Service `telemetry` in the `monitoring` namespace, eks-gitops addon)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4318

env:
  # Non-secret config shared by all three services.
  AWS_REGION: us-east-1
  # The `us.` prefix makes this a cross-region inference profile, and it is
  # load-bearing: the current Claude family reports
  # inferenceTypesSupported: [INFERENCE_PROFILE], so InvokeModel rejects the bare
  # foundation-model id outright ("Invocation of model ID
  # anthropic.claude-sonnet-5 with on-demand throughput isn't supported").
  # Bedrock also marks superseded models Legacy
  # and starts refusing them once an account has not called them for 30 days,
  # so this pin rots on its own. `npm run eval` is what notices either.
  BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-5
  LOG_LEVEL: info
  NODE_ENV: production
  # OTel — exports to the cluster-level OpenTelemetry Collector (no per-pod
  # sidecar). The gateway is an eks-gitops addon; its Service alias is `telemetry`
  # in the `monitoring` namespace and exposes the OTLP receiver on 4317 (gRPC) and
  # 4318 (HTTP). The receiver takes no authentication — it is in-cluster and
  # reachable only through the NetworkPolicy egress rule below — so no
  # OTEL_EXPORTER_OTLP_HEADERS is set. The gateway fans out from there: traces to
  # in-cluster Tempo, metrics to Amazon Managed Prometheus over SigV4
  # remote-write signed with the collector's own Pod Identity, logs to in-cluster Loki.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry.monitoring.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_SAMPLER: always_on
  OTEL_METRICS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: '60000'
  # OTel resource attrs — agents.tenant/agents.platform required by PLATFORM_TENANT_CONTRACT
  OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=digest-pipeline,service.version=0.1.0,agents.tenant=growth,agents.platform=digest-pipeline'

# Per-tenant infra references — populated by per-env values from the
# landing-zone tenant-substrate component's outputs (terragrunt run-all
# output -json). Empty at the chart level for local dev.
tenantInfra:
  voiceBaselineBucket: ''
  rawAggregationsBucket: ''
  # Secrets Manager paths, not secret material: the pipeline resolves each of
  # these at runtime through the tenant role. They are plain config, so they are
  # env here rather than projected — but every one must be listed in the Platform
  # CR's spec.identity.directSecretReads or the read is denied.
  approversSecretId: '' # passed via env, fetched at runtime
  workosDirectorySecretId: ''
  slackSecretId: ''
  githubSecretId: ''
  linearSecretId: ''
  notionSecretId: ''

nodeSelector: {}
tolerations: []
affinity: {}
