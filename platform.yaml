# Platform CR — declares digest-pipeline as a tenant of the protohype team on the
# eks-agent-platform operator. Apply once per cluster before the
# ApplicationSet entry starts reconciling the chart.
#
# Two CRs declared here:
#   - BudgetPolicy (referenced by Platform.spec.budget — required)
#   - Platform     (the actual tenant declaration)
#
# What the operator reconciles from the Platform CR:
#   - Namespace `tenants-protohype` (Pod Security Standards baseline)
#   - ResourceQuota + LimitRange
#   - Default-deny NetworkPolicy (the chart layers app-specific rules on top)
#   - ArgoCD AppProject scoped to this Platform
#   - Per-Platform IRSA role with baseline policy + spec.identity.extraPolicyArns
#     attached. Trust policy permits the `tenant-runtime` ServiceAccount in
#     the tenant namespace
#
# What digest-pipeline's chart owns separately (NOT operator-reconciled):
#   - The chart's own ServiceAccount (`digest-pipeline`) — used by all three workloads
#     (pipeline CronJob + api + web). Its `eks.amazonaws.com/role-arn`
#     annotation comes from landing-zone's digest-pipeline-platform component
#     (output: irsa_role_arn) via per-env Helm values (aws.platformRoleArn).
#     The operator's `<env>-digest-pipeline-tenant` role trusts the `tenant-runtime`
#     SA, not digest-pipeline's `digest-pipeline` SA — different SA, different trust, two
#     roles serving two workload classes (AgentFleet pods vs digest-pipeline's
#     app pods)
#
# Tenant-shared infra (Aurora Serverless v2 Postgres, S3 voice-baseline +
# raw-aggregations, SES verified identity + configuration set, Bedrock
# invoke policy, Secrets Manager seeding) — see landing-zone's
# components/aws/digest-pipeline-platform/. Once that component's per-env entry
# applies, the outputs are wired into the chart's per-env values
# (`tenantInfra.*` + `aws.platformRoleArn`). SES DKIM CNAME records are
# emitted as outputs for the operator to publish to the apex DNS zone.

---
apiVersion: governance.nanohype.dev/v1alpha1
kind: BudgetPolicy
metadata:
  name: digest-pipeline
  namespace: tenants-protohype
spec:
  platformRef:
    name: digest-pipeline
  # Soft threshold; kill-switch fires at 120% (USD 2400) when KillSwitchEnabled
  # is true. Smaller than almanac because digest-pipeline's Bedrock fanout is
  # weekly (CronJob run), not per-query.
  monthlyUsd: '2000'
  alertThresholdsPercent: [50, 80, 100]
  killSwitchEnabled: true
---
apiVersion: platform.nanohype.dev/v1alpha1
kind: Platform
metadata:
  name: digest-pipeline
  namespace: tenants-protohype
spec:
  displayName: digest-pipeline
  persona: ops
  tenant: protohype
  budget:
    name: digest-pipeline
  identity:
    # Bedrock model access for AgentFleet pods (tenant-runtime SA on the
    # operator-reconciled IRSA role). digest-pipeline's own app pods don't use this
    # role; they assume the landing-zone-owned `digest-pipeline-platform` IRSA role
    # (via aws.platformRoleArn in the chart). The operator's role still
    # exists for AgentFleet workloads in this namespace if/when they land.
    allowedModelFamilies:
      - anthropic
    # ARN(s) of additional managed policies the operator attaches on top of
    # the per-tenant baseline. Populate once landing-zone's digest-pipeline-platform
    # component is refactored to emit `irsa_managed_policy_arn` as an
    # output. Leave empty until then — the chart's app pods don't need this
    # since they assume the landing-zone-owned role directly.
    extraPolicyArns: []
  compliance:
    soc2: true
  isolation: namespace
