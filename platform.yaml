# Platform CR — declares digest-pipeline as a tenant of the growth team on the
# eks-agent-platform operator. Apply once per cluster before the
# ApplicationSet entry starts reconciling the chart.
#
# Three CRs declared here:
#   - Tenant       (the growth team — the owner `Platform.spec.tenant` names)
#   - BudgetPolicy (referenced by Platform.spec.budget — required)
#   - Platform     (the actual tenant declaration)
#
# Tenant is cluster-scoped, so it takes no namespace. BudgetPolicy and Platform
# live in the growth team's management namespace (`tenants-growth`). That is
# where the team's Platform declarations are kept; it is not the namespace the
# workloads run in — the operator derives that one from `metadata.name`.
#
# What the operator reconciles from the Platform CR:
#   - Workload namespace `tenants-digest-pipeline`, derived from the Platform
#     name (Pod Security Standards baseline)
#   - ResourceQuota + LimitRange
#   - Default-deny NetworkPolicy (the chart layers app-specific rules on top)
#   - ArgoCD AppProject `digest-pipeline`, scoped to that namespace
#   - Per-Platform IAM role (`<env>-digest-pipeline-tenant`) with the baseline
#     policy + spec.identity.extraPolicyArns attached and Bedrock invoke
#     clamped to spec.identity.allowedModels (bedrock-model-scoping inline
#     policy). Trust is the EKS Pod Identity service principal; SAs bind via
#     Pod Identity associations (`tenant-runtime` by the operator, the app
#     SA by landing-zone)
#
# Pod identity: the operator creates and owns the `tenant-runtime` ServiceAccount
# (shared by all three workloads — pipeline CronJob + api + web) and binds it to
# the `<env>-digest-pipeline-tenant` role via an EKS Pod Identity association —
# no role-arn annotation. App pods and AgentFleet pods run as it: one Platform,
# one privilege domain. Bedrock access is the agent-iam baseline clamped to
# spec.identity below; substrate access is the datastore-access policy the
# operator generates from spec.datastores, and SES send is the capability-access
# policy generated from spec.identity.capabilities.
#
# Tenant substrate is declared, not a component: spec.datastores below names the
# Aurora Postgres store and the two S3 buckets, provisioned by the generic
# tenant-substrate module; their endpoints wire into the chart's per-env values
# (`tenantInfra.*`). The `ses` capability grants send; the verified sending
# identity + DKIM is account-level mail infrastructure in landing-zone, not
# provisioned per app.

---
apiVersion: platform.nanohype.dev/v1alpha1
kind: Tenant
metadata:
  name: growth
  labels:
    agents.nanohype.dev/tenant: growth
spec:
  # The growth team — internal comms and audience programs. Owns the weekly
  # all-hands newsletter this Platform generates, drafts and sends.
  displayName: Growth
  primaryPersona: ops
  # Soft ceiling on the sum of every owned Platform's BudgetPolicy.monthlyUsd.
  # digest-pipeline is the only Platform under this Tenant today.
  aggregateMonthlyBudgetUsd: '2000'
  compliance:
    soc2: true
    hipaa: false
---
apiVersion: governance.nanohype.dev/v1alpha1
kind: BudgetPolicy
metadata:
  name: digest-pipeline
  namespace: tenants-growth
spec:
  platformRef:
    name: digest-pipeline
  # Soft threshold; kill-switch fires at 120% (USD 2400) when KillSwitchEnabled
  # is true. Smaller than almanac because digest-pipeline's Bedrock fanout is
  # weekly (CronJob run), not per-query.
  monthlyUsd: '2000'
  alertThresholdsPercent: [50, 80, 100]
  killSwitchEnabled: true
---
apiVersion: platform.nanohype.dev/v1alpha1
kind: Platform
metadata:
  name: digest-pipeline
  namespace: tenants-growth
spec:
  displayName: digest-pipeline
  persona: ops
  tenant: growth
  budget:
    name: digest-pipeline
  identity:
    # Bedrock model access for every pod in this Platform — app pods and
    # AgentFleet pods share the operator-reconciled `<env>-digest-pipeline-tenant`
    # role. The operator clamps Bedrock invoke on that role to exactly this
    # ID (bedrock-model-scoping inline policy over the baseline grant); the
    # entry matches what the app's config invokes.
    allowedModels:
      - anthropic.claude-sonnet-5 # the ModelGateway route's model — newsletter generation
    # Escape hatch for grants outside the datastore + capability vocabularies.
    # S3 access rides spec.datastores and SES send rides capabilities below, so
    # nothing is needed here.
    extraPolicyArns: []
    # Non-datastore capability: SES send. The operator generates the send grant
    # (ses:SendEmail, FromAddress-scoped); the verified sending identity is
    # account-level mail infrastructure in landing-zone, not provisioned per app.
    capabilities:
      - ses
    # Secrets the pods fetch directly via the SDK rather than through the chart's
    # ExternalSecret: the approver list and the WorkOS Directory Sync credentials,
    # resolved at runtime by the api + pipeline (APPROVERS_SECRET_ID /
    # WORKOS_DIRECTORY_SECRET_ID). DATABASE_URL and the rest are
    # ExternalSecret-projected and need no grant. The operator grants read on
    # exactly these under the tenant's own digest-pipeline/<env>/ prefix.
    directSecretReads:
      - approvers
      - workos-directory
      # The four provider tokens the pipeline resolves through the SDK at run
      # time, one per aggregator. They are not ExternalSecret-projected because
      # each aggregator fetches its own on demand — so without these entries the
      # weekly run reaches Secrets Manager and gets AccessDenied, per source.
      - github
      - linear
      - slack
      - notion
  compliance:
    soc2: true
  isolation: namespace
  # Stateful substrate: the Aurora Postgres store (draft + audit tables) and the
  # two S3 buckets (voice-baseline few-shots + raw source aggregations). The
  # tenant-substrate module provisions them and the operator generates the scoped
  # datastore-access policy; deletionPolicy defaults to Retain.
  datastores:
    - name: main
      kind: relational
    - name: voice-baseline
      kind: objectStore
    - name: raw-aggregations
      kind: objectStore
---
# The model plane. The app names a route, never a model: this CR maps `default`
# to a concrete Bedrock inference profile, and the gateway rewrites the request
# upstream. Model selection, the `us.` inference-profile prefix the Claude family
# requires, the guardrail and the rate limit all live here rather than in chart
# values, so changing a model is a CR edit rather than a redeploy of the app.
#
# The operator reconciles this into an Envoy AI Gateway data plane in
# `tenants-digest-pipeline`, running under the tenant ServiceAccount — so the
# gateway reaches Bedrock as this tenant and the app itself holds no AWS model
# credential. `MODEL_GATEWAY_ENDPOINT` in the chart is this gateway's published
# endpoint.
apiVersion: agents.nanohype.dev/v1alpha1
kind: ModelGateway
metadata:
  name: digest-pipeline
  namespace: tenants-growth
spec:
  platformRef:
    name: digest-pipeline
  routes:
    # The weekly newsletter draft. One route, because the pipeline makes exactly
    # one model call per run.
    - name: default
      modelSource: foundation
      modelFamily: anthropic
      modelId: anthropic.claude-sonnet-5
      # The current Claude family reports inferenceTypesSupported:
      # [INFERENCE_PROFILE], so the bare foundation-model id is rejected by
      # InvokeModel. Outside the US switch this to `eu.` / `global.` and widen
      # spec.identity.allowedModels on the Platform to match.
      crossRegionProfile: us.anthropic.claude-sonnet-5
      # The pipeline runs once a week and makes one call. A limit this loose is
      # a runaway guard, not a quota — it exists so a retry storm cannot bill
      # unbounded, and any normal run is nowhere near it.
      rateLimit: 30
