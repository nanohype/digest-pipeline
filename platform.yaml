# Platform CR — declares digest-pipeline as a tenant of the growth team on the
# eks-agent-platform operator. Apply once per cluster before the
# ApplicationSet entry starts reconciling the chart.
#
# Two CRs declared here:
#   - BudgetPolicy (referenced by Platform.spec.budget — required)
#   - Platform     (the actual tenant declaration)
#
# Both CRs live in the growth team's management namespace (`tenants-growth`).
# That is where the team's Platform declarations are kept; it is not the
# namespace the workloads run in — the operator derives that one from
# `metadata.name`.
#
# What the operator reconciles from the Platform CR:
#   - Workload namespace `tenants-digest-pipeline`, derived from the Platform
#     name (Pod Security Standards baseline)
#   - ResourceQuota + LimitRange
#   - Default-deny NetworkPolicy (the chart layers app-specific rules on top)
#   - ArgoCD AppProject `digest-pipeline`, scoped to that namespace
#   - Per-Platform IAM role (`<env>-digest-pipeline-tenant`) with the baseline
#     policy + spec.identity.extraPolicyArns attached and Bedrock invoke
#     clamped to spec.identity.allowedModels (bedrock-model-scoping inline
#     policy). Trust is the EKS Pod Identity service principal; SAs bind via
#     Pod Identity associations (`tenant-runtime` by the operator, the app
#     SA by landing-zone)
#
# What digest-pipeline's chart owns separately (NOT operator-reconciled):
#   - The chart's own ServiceAccount (`digest-pipeline`) — used by all three workloads
#     (pipeline CronJob + api + web). It is bound to the operator-reconciled
#     `<env>-digest-pipeline-tenant` role by an EKS Pod Identity association the
#     landing-zone digest-pipeline-platform component creates — no role-arn
#     annotation. App pods and AgentFleet pods (`tenant-runtime` SA) share that
#     role: one Platform, one privilege domain. Bedrock access on the role is
#     the agent-iam baseline clamped to spec.identity below; the app's
#     substrate grants arrive via spec.identity.extraPolicyArns.
#
# Tenant-shared infra (Aurora Serverless v2 Postgres, S3 voice-baseline +
# raw-aggregations, SES verified identity + configuration set, Secrets
# Manager seeding, the app-access managed policy) — see landing-zone's
# components/aws/digest-pipeline-platform/. Once that component's per-env entry
# applies, the outputs are wired into the chart's per-env values
# (`tenantInfra.*`). SES DKIM CNAME records are
# emitted as outputs for the operator to publish to the apex DNS zone.

---
apiVersion: governance.nanohype.dev/v1alpha1
kind: BudgetPolicy
metadata:
  name: digest-pipeline
  namespace: tenants-growth
spec:
  platformRef:
    name: digest-pipeline
  # Soft threshold; kill-switch fires at 120% (USD 2400) when KillSwitchEnabled
  # is true. Smaller than almanac because digest-pipeline's Bedrock fanout is
  # weekly (CronJob run), not per-query.
  monthlyUsd: '2000'
  alertThresholdsPercent: [50, 80, 100]
  killSwitchEnabled: true
---
apiVersion: platform.nanohype.dev/v1alpha1
kind: Platform
metadata:
  name: digest-pipeline
  namespace: tenants-growth
spec:
  displayName: digest-pipeline
  persona: ops
  tenant: growth
  budget:
    name: digest-pipeline
  identity:
    # Bedrock model access for every pod in this Platform — app pods and
    # AgentFleet pods share the operator-reconciled `<env>-digest-pipeline-tenant`
    # role. The operator clamps Bedrock invoke on that role to exactly this
    # ID (bedrock-model-scoping inline policy over the baseline grant); the
    # entry matches what the app's config invokes.
    allowedModels:
      - anthropic.claude-sonnet-4-6 # BEDROCK_MODEL_ID — newsletter generation
    # The app's substrate grants (S3, SES, Secrets Manager, CloudWatch) —
    # landing-zone's digest-pipeline-platform component emits the policy as
    # `app_access_policy_arn`. Account-scoped, so it is filled per
    # environment at apply time (landing-zone
    # docs/first-deploy-aws.md, App platform tenants):
    #   arn:aws:iam::<account>:policy/eks-agent-platform/<env>-digest-pipeline-app-access
    extraPolicyArns: []
  compliance:
    soc2: true
  isolation: namespace
